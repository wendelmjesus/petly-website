<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petly</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <nav class="header">
        <a href="../pages/index.html">
            <img class="logo" src="../assets/logo.svg" alt="Petly Logo">

        <div class="nav-center">
            <div class="menu">
                <a href="../pages/index.html">Início</a>
                <a href="../pages/sobre.html">Sobre</a>
                <a href="../pages/servicos.html">Serviços</a>
                <a href="../pages/contato.html">Contato</a>
            </div>

            <div class="search">

                <input class="search-input" type="text" placeholder="Pesquisar...">

            </div>

        </div>

        <div class="account">

            <button class="account-btn" aria-label="Conta">
                <img src="../assets/icons/account-icon.svg" alt="" class="account-icon">
            </button>

            <div class="account-menu">
                <a href="../pages/login.html">Entrar</a>
                <a href="../pages/register.html">Sou novo</a>
            </div>

        </div>

    </nav>

    <div class="container"> 

        <div class="banner">
            <img id="banner-img" src="../assets/images/banner-1.png" alt="Banner de Brinquedos">
            
            <button class="banner-arrow banner-arrow-left" aria-label="Imagem anterior">‹</button>
            <button class="banner-arrow banner-arrow-right" aria-label="Próxima imagem">›</button>

            <button class="banner-btn">Confira nossos brinquedos</button>
        </div>
    
        <section class="categories">
            <div class="section-header">
                <h2>Categorias</h2>
                <a href="categories.html">Encontre o que seu amigo precisa</a>
            </div>

            <div class="category-list">
                <a href="#" class="category-card">
                    <img src="../assets/images/toys.png" alt="Brinquedos para pets">
                    <span>Brinquedos</span>
                </a>

                <a href="#" class="category-card">
                    <img src="../assets/images/acessories.png" alt="Rações para pets">
                    <span>Acessórios</span>
                </a>

                <a href="#" class="category-card">
                    <img src="../assets/images/raçao.png" alt="Produtos de higiene para pets">
                    <span>Rações</span>
                </a>

                <a href="#" class="category-card">
                    <img src="../assets/images/higiene.png" alt="Acessórios para pets">
                    <span>Higiene</span>
                </a>

                <a href="#" class="category-card">
                    <img src="../assets/images/promocoes.png" alt="Promoções para pets">
                    <span>Promoções</span>
                </a>
            </div>
        
        </section>

    </div>

<script src="../scripts/script.js"></script>

</html>
